# Render Blueprint for the backend API. Deploy via https://render.com -> New -> Blueprint,
# point it at this repo. Render injects its own PORT env var, which backend/src/config.ts
# already falls back to. Fill in the `sync: false` secret values in the Render dashboard
# after the first deploy (they're deliberately not stored in this file).
services:
  - type: web
    name: vqa-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGIN
        sync: false # e.g. https://your-username.github.io
      - key: LLM_PROVIDER
        value: google
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_TEXT_MODEL
        value: gemini-flash-lite-latest
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_VISION_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_TEXT_MODEL
        value: claude-sonnet-5
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
      - key: OPENAI_TEXT_MODEL
        value: gpt-4o
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
      - key: HISTORY_STORE
        value: file
      - key: MIN_OCR_CONFIDENCE
        value: "0.55"
